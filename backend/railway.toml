# Railway.app configuration for RentFlow Backend
# Railway auto-detects services from Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPaths = ["src/**", "package.json", "package-lock.json", "tsconfig.json", "Dockerfile", "railway.toml"]

[deploy]
# Use CMD from Dockerfile instead of overriding
# startCommand = "npm start"
restartPolicyMaxRetries = 5
restartPolicyWindowSeconds = 600
