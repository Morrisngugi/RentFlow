# Railway configuration for RentFlow Frontend
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPaths = ["src/**", "public/**", "package.json", "package-lock.json", "next.config.js", "next-env.d.ts", "postcss.config.mjs", "tailwind.config.ts", "tsconfig.json", "start.sh", "Dockerfile", "railway.toml"]

[deploy]
restartPolicyMaxRetries = 5
restartPolicyWindowSeconds = 600
